# tracker.yaml — default tracker parameters.
# NOTE: v1 uses the defaults baked into TrackerConfig (include/Types.hpp).
# This file documents them and is the target for the v2 YAML loader.

confidence:
  strong_threshold: 0.70
  weak_threshold:   0.45
  ncc_weight:       0.5
  psr_weight:       0.5
  psr_saturation:   12.0   # PSR value mapped to confidence 1.0

search:
  expansion:            2.0   # ROI side = box side * this, while tracking
  reacq_expansion_step: 0.6   # grow per lost frame
  reacq_max_expansion:  6.0   # cap

match:
  scales: [0.85, 0.925, 1.0, 1.075, 1.15]

gating:
  max_speed:      120.0   # max center displacement (px/frame) vs prediction
  max_size_ratio: 1.6     # max area growth/shrink per frame

template:
  learn_rate: 0.05        # blend factor, applied only when TRACKING

io:
  display:     true
  output_path: outputs/videos/tracked.mp4
